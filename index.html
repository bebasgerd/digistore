<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Practice - Ujian Live Coding 15 Materi HTML & CSS</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    #pelanggaran-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(239, 68, 68, 0.95);
      backdrop-filter: blur(8px);
      color: white;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      display: none;
      z-index: 9999;
    }

    .badge-v { background: #fff; color: var(--danger); padding: 2px 8px; border-radius: 6px; font-weight: 800; }

    .container {
      width: 100%;
      max-width: 1250px;
      margin: 20px auto;
      padding: 20px;
      flex: 1;
    }

    /* Card Login & Hasil */
    .card-box {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      max-width: 600px;
      margin: 40px auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header-title { text-align: center; margin-bottom: 24px; }
    .header-title h1 {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
    .input-control {
      width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border);
      padding: 14px 18px; border-radius: 12px; color: #fff; font-size: 15px; outline: none;
    }

    .btn {
      width: 100%; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-pause {
      background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
      color: white; border: none; padding: 8px 16px; border-radius: 30px;
      font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn-pause:hover { opacity: 0.9; }

    /* Layout Ujian Coding */
    .exam-topbar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.8); border: 1px solid var(--card-border);
      padding: 16px 24px; border-radius: 16px; margin-bottom: 20px;
    }

    .right-controls {
      display: flex; align-items: center; gap: 12px;
    }

    .timer-badge {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; padding: 8px 16px; border-radius: 30px; font-weight: 800; font-size: 18px;
      display: flex; align-items: center; gap: 8px;
    }

    .soal-instruction {
      background: rgba(30, 41, 59, 0.6); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 20px; margin-bottom: 20px; font-size: 13px; line-height: 1.6;
    }
    .soal-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin-top: 10px; color: var(--text-muted);
    }
    .soal-grid div { display: flex; align-items: center; gap: 6px; }

    .editor-container {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; min-height: 500px;
    }

    .pane {
      display: flex; flex-direction: column; background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden;
    }

    .pane-header {
      background: rgba(30, 41, 59, 0.8); padding: 12px 18px; font-weight: 700; font-size: 13px;
      color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }

    textarea#code-input {
      flex: 1; width: 100%; height: 100%; background: #090d16; color: #38bdf8;
      border: none; padding: 18px; font-family: 'Fira Code', monospace; font-size: 13.5px;
      line-height: 1.6; resize: none; outline: none; tab-size: 2;
    }

    iframe#preview-frame {
      flex: 1; width: 100%; height: 100%; background: #ffffff; border: none;
    }

    /* Modal Overlay Pause / Istirahat */
    #pause-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
      z-index: 10000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }

    .pause-card {
