<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Online - Tes Ketuntasan</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; user-select: none; }
    .container { max-width: 800px; background: #fff; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    .btn { background: #27ae60; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn:hover { background: #219150; }
    .soal-box { margin-bottom: 25px; padding: 15px; border-bottom: 1px solid #eee; }
    .soal-text { font-size: 16px; font-weight: 600; color: #2c3e50; margin-bottom: 12px; line-height: 1.5; }
    .opsi-label { display: flex; align-items: center; padding: 10px 14px; margin: 6px 0; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .opsi-label:hover { background: #edf2f7; }
    .opsi-label input { margin-right: 12px; transform: scale(1.2); }
    #pelanggaran-bar { background: #e74c3c; color: white; text-align: center; padding: 10px; font-weight: bold; position: fixed; top: 0; left: 0; width: 100%; display: none; z-index: 1000; }
    .result-box { text-align: center; padding: 20px; }
    .status-lulus { color: #27ae60; font-size: 24px; font-weight: bold; }
    .status-gagal { color: #c0392b; font-size: 24px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div id="pelanggaran-bar">PERINGATAN! Anda keluar dari mode ujian. Pelanggaran tercatat: <span id="violation-count">0</span>x</div>

<div class="container">
  <!-- Halaman Login -->
  <div id="page-login">
    <h2>Ujian Kompetensi Online</h2>
    <p style="text-align: center; color: #e74c3c; font-size: 14px;">
      * Catatan: Nilai ketuntasan minimal adalah <strong>80</strong>. Jika di bawah 80, Anda wajib mengulang dari awal.<br>
      Dilarang keluar dari layar penuh / berpindah tab!
    </p>
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required autocomplete="off">
    </div>
    <div class="form-group">
      <label>Kelas / Rombel</label>
      <input type="text" id="kelas" placeholder="Masukkan Kelas" required autocomplete="off">
    </div>
    <button class="btn" onclick="mulaiUjian()">Mulai Ujian Now</button>
  </div>

  <!-- Halaman Ujian -->
  <div id="page-ujian" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
      <span id="display-peserta" style="font-weight: bold;"></span>
      <span style="background: #e67e22; color: white; padding: 4px 10px; border-radius: 4px; font-size: 14px;">KKM: 80</span>
    </div>

    <form id="form-soal">
      <div id="soal-container"></div>
      <button type="button" class="btn" id="btn-submit" onclick="konfirmasiSelesai()">Kirim Jawaban</button>
    </form>
  </div>

  <!-- Halaman Hasil -->
  <div id="page-hasil" class="hidden">
    <div class="result-box">
      <h2>Hasil Ujian</h2>
      <p style="font-size: 18px;">Skor Akhir Anda:</p>
      <div id="display-skor" style="font-size: 48px; font-weight: bold; margin: 10px 0;">0</div>
      <div id="status-text"></div>
      <p id="pesan-detail" style="margin-top: 15px; color: #555;"></p>
      <div id="action-remedial" class="hidden" style="margin-top: 25px;">
        <button class="btn" style="background: #e67e22;" onclick="ulangUjian()">Mengulang Ujian Baru</button>
      </div>
    </div>
  </div>
</div>

<script>
  // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
  const GAS_WEB_APP_URL = "URL_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI";

  // BANK SOAL (10 Soal - Template Sementara)
  const bankSoal = [
    {
      id: 1,
      soal: "1. Apa fungsi utama dari protokol HTTP pada komunikasi jaringan web?",
      opsi: {
        a: "Mengirimkan dokumen hypertext antar server dan klien web",
        b: "Mengamankan lalu lintas data melalui enkripsi siber",
        c: "Mengonversi nama domain menjadi alamat IP numerik",
        d: "Mengelola pengalamatan fisik pada adapter jaringan lokal",
        e: "Menghubungkan dua arsitektur basis data yang berbeda"
      },
      kunci: "a"
    },
    {
      id: 2,
      soal: "2. Bahasa pemrograman manakah yang berjalan secara terisolasi di sisi peramban (client-side)?",
      opsi: {
        a: "PHP",
        b: "Python",
        c: "JavaScript",
        d: "Ruby",
        e: "SQL"
      },
      kunci: "c"
    }
    // Soal 3-10 akan diisikan otomatis setelah Anda mengirimkan daftar soalnya.
  ];

  let dataPeserta = { nama: "", kelas: "" };
  let jumlahPelanggaran = 0;
  let isUjianAktif = false;

  function mulaiUjian() {
    const nama = document.getElementById('nama').value.trim();
    const kelas = document.getElementById('kelas').value.trim();

    if (!nama || !kelas) {
      alert("Harap isi Nama dan Kelas terlebih dahulu!");
      return;
    }

    dataPeserta.nama = nama;
    dataPeserta.kelas = kelas;

    document.getElementById('display-peserta').innerText = `${nama} (${kelas})`;
    document.getElementById('page-login').classList.add('hidden');
    document.getElementById('page-ujian').classList.remove('hidden');

    renderSoal();
    openFullscreen();
    isUjianAktif = true;
    aktifkanPengawas();
  }

  function renderSoal() {
    const container = document.getElementById('soal-container');
    container.innerHTML = "";

    bankSoal.forEach((q) => {
      let html = `<div class="soal-box">
        <div class="soal-text">${q.soal}</div>`;
      
      for (let key in q.opsi) {
        html += `
          <label class="opsi-label">
            <input type="radio" name="soal_${q.id}" value="${key}" required>
            <span><strong>${key.toUpperCase()}.</strong> ${q.opsi[key]}</span>
          </label>
        `;
      }
      html += `</div>`;
      container.innerHTML += html;
    });
  }

  function konfirmasiSelesai() {
    let semuaTerisi = true;
    bankSoal.forEach(q => {
      const checked = document.querySelector(`input[name="soal_${q.id}"]:checked`);
      if (!checked) semuaTerisi = false;
    });

    if (!semuaTerisi) {
      alert("Harap jawab semua soal sebelum mengirimkan!");
      return;
    }

    if (confirm("Apakah Anda yakin ingin menyelesaikan ujian?")) {
      hitungHasil();
    }
  }

  function hitungHasil() {
    isUjianAktif = false;
    let benar = 0;

    bankSoal.forEach(q => {
      const selected = document.querySelector(`input[name="soal_${q.id}"]:checked`);
      if (selected && selected.value === q.kunci) {
        benar++;
      }
    });

    const skorTotal = (benar / bankSoal.length) * 100;

    // Tampilkan Loading pada tombol
    const btnSubmit = document.getElementById('btn-submit');
    btnSubmit.innerText = "Mengirimkan Nilai...";
    btnSubmit.disabled = true;

    // Kirim data asynchronous ke Google Apps Script
    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nama: dataPeserta.nama,
        kelas: dataPeserta.kelas,
        skor: skorTotal,
        pelanggaran: jumlahPelanggaran
      })
    })
    .then(() => {
      tampilkanHalamanHasil(skorTotal);
    })
    .catch((error) => {
      console.error("Gagal mengirim data:", error);
      // Tetap tampilkan hasil meski koneksi simpan error
      tampilkanHalamanHasil(skorTotal);
    });
  }

  function tampilkanHalamanHasil(skor) {
    closeFullscreen();
    document.getElementById('page-ujian').classList.add('hidden');
    document.getElementById('page-hasil').classList.remove('hidden');
    document.getElementById('pelanggaran-bar').style.display = 'none';

    document.getElementById('display-skor').innerText = skor;

    const statusText = document.getElementById('status-text');
    const pesanDetail = document.getElementById('pesan-detail');
    const actionRemedial = document.getElementById('action-remedial');

    if (skor >= 80) {
      statusText.innerHTML = `<span class="status-lulus">SELAMAT! Anda Tuntas (LULUS)</span>`;
      pesanDetail.innerText = "Nilai Anda telah memenuhi batas ketuntasan minimal (KKM >= 80).";
      actionRemedial.classList.add('hidden');
    } else {
      statusText.innerHTML = `<span class="status-gagal">TIDAK TUNTAS (GAGAL)</span>`;
      pesanDetail.innerText = "Nilai Anda di bawah 80. Sesuai aturan, Anda tidak dapat melihat kunci jawaban dan wajib mengulang ujian.";
      actionRemedial.classList.remove('hidden');
    }
  }

  function ulangUjian() {
    jumlahPelanggaran = 0;
    document.getElementById('violation-count').innerText = 0;
    document.getElementById('page-hasil').classList.add('hidden');
    document.getElementById('page-ujian').classList.remove('hidden');
    document.getElementById('form-soal').reset();
    
    const btnSubmit = document.getElementById('btn-submit');
    btnSubmit.innerText = "Kirim Jawaban";
    btnSubmit.disabled = false;

    openFullscreen();
    isUjianAktif = true;
  }

  // === ANTI-CHEAT & FULLSCREEN ===
  function openFullscreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
  }

  function closeFullscreen() {
    if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
  }

  function aktifkanPengawas() {
    document.getElementById('pelanggaran-bar').style.display = 'block';

    document.addEventListener('fullscreenchange', handleViolation);
    document.addEventListener('webkitfullscreenchange', handleViolation);

    window.addEventListener('blur', function() {
      if (isUjianAktif) catatPelanggaran("Berpindah aplikasi / Tab browser");
    });
  }

  function handleViolation() {
    if (isUjianAktif && !document.fullscreenElement && !document.webkitFullscreenElement) {
      catatPelanggaran("Keluar dari layar penuh (Fullscreen)");
    }
  }

  function catatPelanggaran(alasan) {
    jumlahPelanggaran++;
    document.getElementById('violation-count').innerText = jumlahPelanggaran;
    alert(`PERINGATAN PELANGGARAN (${jumlahPelanggaran}x)!\nAlasan: ${alasan}.\nKembali fokus ke halaman ujian!`);
    if (isUjianAktif) openFullscreen();
  }
</script>

</body>
</html>
